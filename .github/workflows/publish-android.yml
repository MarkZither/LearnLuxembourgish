name: Publish Android

# Triggered manually or on version tags (e.g. v1.2.3)
on:
  workflow_dispatch:
    inputs:
      upload_to_play_store:
        description: 'Upload AAB to Play Store internal track after build?'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build & Sign Android AAB
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java (needed for the Android toolchain) ────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── .NET SDK ───────────────────────────────────────────────────────────
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'

      # ── MAUI Android workload ──────────────────────────────────────────────
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --source https://api.nuget.org/v3/index.json

      # ── Accept Android SDK licences (already present on ubuntu-latest) ─────
      - name: Accept Android SDK licences
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── Inject production appsettings ──────────────────────────────────────
      # This file is gitignored; CI creates it from a secret so the production
      # API URL is never committed to source control.
      - name: Write appsettings.release.json
        env:
          API_URL: ${{ secrets.ANDROID_API_BASE_URL_PROD }}
        run: |
          cat > src/LearnLuxembourgish.Mobile/appsettings.release.json <<EOF
          {
            "ApiBaseUrl": "$API_URL",
            "ApiBaseUrl.Android": "$API_URL"
          }
          EOF

      # ── Decode & write the signing keystore ────────────────────────────────
      # Store the keystore as a base64 secret:
      #   base64 -w 0 learnlux.jks   (Linux/macOS)
      #   [Convert]::ToBase64String([IO.File]::ReadAllBytes('learnlux.jks'))  (PowerShell)
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/learnlux.jks

      # ── Restore NuGet packages ─────────────────────────────────────────────
      - name: Restore
        run: dotnet restore src/LearnLuxembourgish.Mobile/LearnLuxembourgish.Mobile.csproj -f net10.0-android

      # ── Publish ────────────────────────────────────────────────────────────
      - name: Publish Android (Release)
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:     ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish src/LearnLuxembourgish.Mobile/LearnLuxembourgish.Mobile.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=/tmp/learnlux.jks \
            -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$KEY_PASS" \
            -p:AndroidSigningStorePass="$KEYSTORE_PASS"

      # ── Remove keystore from runner ────────────────────────────────────────
      - name: Clean up keystore
        if: always()
        run: rm -f /tmp/learnlux.jks

      # ── Upload AAB artifact ────────────────────────────────────────────────
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.ref_name }}
          path: |
            src/LearnLuxembourgish.Mobile/bin/Release/net10.0-android/publish/*.aab
            src/LearnLuxembourgish.Mobile/bin/Release/net10.0-android/publish/*-Signed.apk
          if-no-files-found: warn
          retention-days: 30
